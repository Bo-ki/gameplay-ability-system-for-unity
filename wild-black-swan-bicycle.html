<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>野生黑天鹅骑自行车</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #10151c;
            --ink-soft: #252d36;
            --rose: #d94d62;
            --gold: #f4bd58;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #0b1320;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        .scene {
            width: min(100vw, 1100px);
            aspect-ratio: 10 / 7;
            position: relative;
            filter: drop-shadow(0 24px 44px rgba(0, 0, 0, .28));
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wheel {
            fill: none;
            stroke: #16212d;
            stroke-width: 9;
        }

        .spoke {
            stroke: #52606b;
            stroke-width: 2;
            opacity: .7;
        }

        .metal {
            fill: none;
            stroke: #d7a84d;
            stroke-width: 8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .thin-metal {
            fill: none;
            stroke: #f2c968;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .feather-line {
            fill: none;
            stroke: #9ba8b0;
            stroke-width: 4;
            stroke-linecap: round;
            opacity: .48;
        }

        .caption {
            letter-spacing: .22em;
            font-size: 16px;
            fill: #e8f0f5;
            opacity: .78;
        }
    </style>
</head>
<body>
    <main class="scene" aria-label="野生黑天鹅骑自行车的 SVG 插画">
        <svg viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
            <title id="title">野生黑天鹅骑自行车</title>
            <desc id="desc">一只黑色天鹅迎着晨风骑着金色自行车，穿过湖畔草地。</desc>

            <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#162b4a"/>
                    <stop offset=".56" stop-color="#5b7895"/>
                    <stop offset="1" stop-color="#d9a776"/>
                </linearGradient>
                <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#1a5261"/>
                    <stop offset=".5" stop-color="#3d8890"/>
                    <stop offset="1" stop-color="#164556"/>
                </linearGradient>
                <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#080d13"/>
                    <stop offset=".45" stop-color="#1d2630"/>
                    <stop offset="1" stop-color="#05080d"/>
                </linearGradient>
                <linearGradient id="wing" x1="0" y1="0" x2="1" y2=".9">
                    <stop offset="0" stop-color="#3d4b57"/>
                    <stop offset=".7" stop-color="#131b24"/>
                    <stop offset="1" stop-color="#070a0f"/>
                </linearGradient>
                <radialGradient id="sun" cx="50%" cy="50%" r="50%">
                    <stop offset="0" stop-color="#ffe6a1" stop-opacity=".95"/>
                    <stop offset="1" stop-color="#ffd580" stop-opacity="0"/>
                </radialGradient>
                <filter id="softGlow">
                    <feGaussianBlur stdDeviation="12"/>
                </filter>
                <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
                    <feDropShadow dx="0" dy="13" stdDeviation="9" flood-color="#061018" flood-opacity=".5"/>
                </filter>
            </defs>

            <!-- 天空与湖岸 -->
            <rect width="1000" height="700" fill="url(#sky)"/>
            <circle cx="775" cy="126" r="104" fill="url(#sun)" filter="url(#softGlow)"/>
            <circle cx="775" cy="126" r="43" fill="#ffe0a1" opacity=".9"/>
            <path d="M0 282 C130 248 209 274 321 250 S518 252 633 271 S833 244 1000 266 V430 H0Z" fill="#263a43" opacity=".58"/>
            <path d="M0 363 C174 320 278 359 431 336 S725 332 1000 350 V560 H0Z" fill="url(#water)"/>
            <path d="M0 412 C176 382 272 416 445 393 S764 391 1000 411" fill="none" stroke="#8dc1bd" stroke-width="5" opacity=".28"/>
            <path d="M0 465 C176 434 319 475 480 446 S786 446 1000 462" fill="none" stroke="#b9d6cc" stroke-width="4" opacity=".2"/>
            <path d="M0 500 C145 467 291 516 449 484 S769 482 1000 495 V700 H0Z" fill="#203e31"/>
            <path d="M0 542 C167 508 298 556 455 529 S794 529 1000 542 V700 H0Z" fill="#162c25"/>

            <!-- 云与远景鸟群 -->
            <g fill="#dce8ea" opacity=".38">
                <path d="M120 127c13-31 58-34 76-7 23-26 74-11 77 25H84c2-14 13-18 36-18Z"/>
                <path d="M432 91c10-25 45-27 59-5 17-20 53-8 56 21h-143c2-11 11-16 28-16Z"/>
            </g>
            <g fill="none" stroke="#d3e2e3" stroke-width="4" stroke-linecap="round" opacity=".6">
                <path d="M650 174q12-10 24 0q12-10 24 0"/>
                <path d="M684 205q11-9 22 0q11-9 22 0"/>
            </g>

            <!-- 自行车阴影 -->
            <ellipse cx="481" cy="583" rx="248" ry="23" fill="#09141a" opacity=".42"/>

            <!-- 自行车车轮 -->
            <g>
                <circle class="wheel" cx="304" cy="487" r="101"/>
                <circle class="wheel" cx="660" cy="487" r="101"/>
                <circle cx="304" cy="487" r="11" fill="#d7a84d"/>
                <circle cx="660" cy="487" r="11" fill="#d7a84d"/>
                <g class="spoke">
                    <path d="M304 397v180M214 487h180M240 423l128 128M240 551l128-128"/>
                    <path d="M660 397v180M570 487h180M596 423l128 128M596 551l128-128"/>
                </g>
            </g>

            <!-- 车架 -->
            <g class="metal" filter="url(#shadow)">
                <path d="M304 487 L404 367 L536 487 L304 487 L470 487 L404 367"/>
                <path d="M404 367 L519 354 L536 487"/>
                <path d="M519 354 L660 487"/>
            </g>
            <path d="M514 355 L529 318" class="thin-metal"/>
            <path d="M529 318 L568 324" class="thin-metal"/>
            <path d="M396 365 L381 335" class="thin-metal"/>
            <path d="M371 331 L394 331" class="thin-metal"/>
            <circle cx="470" cy="487" r="28" fill="none" stroke="#c99235" stroke-width="7"/>
            <path d="M470 487 L500 470 M470 487 L443 510" class="thin-metal"/>
            <circle cx="500" cy="470" r="8" fill="#f4bd58"/>
            <circle cx="443" cy="510" r="8" fill="#f4bd58"/>

            <!-- 黑天鹅身体 -->
            <g filter="url(#shadow)">
                <ellipse cx="460" cy="322" rx="155" ry="91" fill="url(#feather)"/>
                <path d="M345 319 C359 266 429 235 512 247 C570 255 613 288 624 335 C586 360 536 381 474 378 C410 375 367 356 345 319Z" fill="#111820"/>
                <!-- 展开的翼 -->
                <path d="M405 293 C451 244 531 252 577 292 C539 303 517 337 507 377 C457 367 420 344 405 293Z" fill="url(#wing)"/>
                <path d="M425 289 C456 270 503 270 546 289 C508 294 480 312 460 348" class="feather-line"/>
                <path d="M447 284 C480 283 516 293 537 307" class="feather-line"/>
                <path d="M464 302 C484 310 500 323 509 342" class="feather-line"/>
                <!-- 尾羽 -->
                <path d="M342 321 C302 294 281 288 249 294 C273 315 283 336 311 345 C285 349 273 365 264 383 C304 384 339 366 365 345Z" fill="#0a1016"/>
            </g>

            <!-- 天鹅长颈、头部和喙 -->
            <path d="M560 293 C612 279 649 243 649 199 C649 169 629 151 608 163 C588 174 597 201 617 208" fill="none" stroke="#0a1016" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
            <path d="M561 289 C610 275 641 239 641 201" fill="none" stroke="#28343d" stroke-width="7" stroke-linecap="round" opacity=".8"/>
            <ellipse cx="625" cy="159" rx="38" ry="32" fill="#0a1016" transform="rotate(-12 625 159)"/>
            <path d="M650 160 L697 174 L653 187Z" fill="#d64f5e"/>
            <path d="M650 160 L672 165 L657 174Z" fill="#f2b84f"/>
            <circle cx="638" cy="150" r="5" fill="#f5f2df"/>
            <circle cx="639" cy="150" r="2.3" fill="#0a1016"/>
            <path d="M622 127 Q635 118 649 123" fill="none" stroke="#59636a" stroke-width="4" stroke-linecap="round"/>

            <!-- 天鹅翅膀下的腿 -->
            <path d="M445 374 L435 444 L407 478" fill="none" stroke="#141b20" stroke-width="13" stroke-linecap="round"/>
            <path d="M526 365 L549 431 L525 474" fill="none" stroke="#141b20" stroke-width="13" stroke-linecap="round"/>
            <path d="M407 478 L392 487 M407 478 L415 490" fill="none" stroke="#d89947" stroke-width="5" stroke-linecap="round"/>
            <path d="M525 474 L510 484 M525 474 L534 486" fill="none" stroke="#d89947" stroke-width="5" stroke-linecap="round"/>

            <!-- 骑车姿态：翅膀搭在车把上 -->
            <path d="M550 300 C568 327 568 350 553 373 L527 402" fill="none" stroke="#0b1117" stroke-width="30" stroke-linecap="round"/>
            <path d="M553 373 L530 325" fill="none" stroke="#0b1117" stroke-width="22" stroke-linecap="round"/>
            <path d="M530 325 L522 319" fill="none" stroke="#35434c" stroke-width="7" stroke-linecap="round"/>

            <!-- 草叶 -->
            <g fill="none" stroke-linecap="round">
                <path d="M98 635 Q91 593 109 563 M104 632 Q122 602 139 589 M151 646 Q152 600 177 574 M817 653 Q811 606 830 573 M837 650 Q854 610 875 594 M901 653 Q894 616 916 586" stroke="#4d8b57" stroke-width="8"/>
                <path d="M75 655 Q83 621 96 606 M185 656 Q203 624 222 612 M777 661 Q784 624 800 606 M934 663 Q947 629 962 610" stroke="#7bad63" stroke-width="5"/>
            </g>

            <!-- 标题装饰 -->
            <g transform="translate(54 592)">
                <text class="caption" x="0" y="0">WILD RIDE · LAKE AT DAWN</text>
                <path d="M0 18 H260" stroke="#f4bd58" stroke-width="3" stroke-linecap="round" opacity=".7"/>
            </g>
        </svg>
    </main>
</body>
</html>
